name: codestyle

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: codestyle-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codestyle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mongodb, redis
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install PHP Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # The TypeScript transformer formats its output with Prettier.
      - name: Install Node Dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Check Rector
        run: vendor/bin/rector process --dry-run

      - name: Check PHP Formatting
        run: composer pint -- --test

      - name: Check PHP Syntax
        run: composer lint:syntax

      - name: Run Static Analysis
        run: composer analyse

      - name: Check Generated TypeScript Types
        run: |
          php artisan typescript:transform --quiet
          git diff --exit-code -- resources/js/types/generated.ts
