name: frontend

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Wayfinder boots the application to read the routes, so the frontend
      # build needs PHP with ext-mongodb (no running database).
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mongodb, redis
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install PHP Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node Dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run NPM Security Audit
        run: npm audit --audit-level=high

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Generate Wayfinder Routes
        run: php artisan wayfinder:generate --with-form --no-interaction

      - name: Check Frontend Formatting
        run: npm run format:check

      - name: Check Frontend Lint
        run: npm run lint

      - name: Run Frontend Type Check
        run: npm run types

      - name: Find Unused Files, Exports and Dependencies
        run: npm run knip

      - name: Run Frontend Tests
        run: npm run test

      - name: Build Assets
        run: npm run build:ssr

      - name: Check the SSR bundle carries its own dependencies
        run: npm run ssr:check
