version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 3
    cooldown:
      default-days: 3
      semver-major-days: 7
    labels:
      - dependencies
    groups:
      composer-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: '06:00'
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 3
    cooldown:
      default-days: 3
      semver-major-days: 7
    labels:
      - dependencies
      - frontend
    groups:
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: '06:00'
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - ci
    groups:
      github-actions:
        patterns:
          - '*'
