<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lijst links</title>
<link rel="stylesheet" href="../integratie/stijl.css">
<link rel="stylesheet" href="extra.css">
</head>
<body>
<div class="page-title">
    <h1>Linkerkolom: wat er is en wat er kan</h1>
    <p>Punt 1, 3 en 13 uit <code>vindbaarheid.md</code>. Links nu (printopoly.nl, 1440 px), rechts het voorstel. Roze stippellijn: wat verandert.</p>
</div>

<div class="vs">
    <figure>
        <img src="voor/d-doos.jpg" width="560" alt="Tab Doos met alleen Huisregels">
        <figcaption><span class="tag-voor">nu</span>Sjabloon Je dorp of wijk: Doos toont alleen Huisregels. Geen spoor van uitnodiging, pionnen of deksel, en geen tab Geld.</figcaption>
    </figure>
    <figure>
        <div class="col">
            <div class="edrow new">
                <div class="mini" data-board="" data-size="48"></div>
                <div><div style="font-weight:600">Editie</div><div class="xs soft">naam, thema, onderdelen, woorden</div></div>
                <span style="margin-left:auto">›</span>
            </div>
            <div class="tabs4"><span>Bord</span><span>Kaarten</span><span class="on">Doos</span></div>
            <div class="list">
                <div class="it on">Huisregels <span class="end xs soft">gaat mee met de kaarten</span></div>
                <div class="side new" style="margin-top:14px">Niet in je set</div>
                <div class="it off new"><span class="sw" style="background:var(--chance)"></span><span><b style="font-weight:600">Speelgeld</b><br><span class="xs">biljetten met je eigen foto's</span></span><button class="textbtn">Aanzetten</button></div>
                <div class="it off"><span class="sw" style="border-radius:999px"></span><span><b style="font-weight:600">Pionnen</b><br><span class="xs">naam en foto per speler</span></span><button class="textbtn">Aanzetten</button></div>
                <div class="it off"><span class="sw"></span><span><b style="font-weight:600">Doosdeksel</b><br><span class="xs">titel en foto op de doos</span></span><button class="textbtn">Aanzetten</button></div>
                <div class="it off"><span class="sw" style="background:var(--chest)"></span><span><b style="font-weight:600">Uitnodiging</b><br><span class="xs">kaart met datum en plek</span></span><button class="textbtn">Aanzetten</button></div>
                <div class="it off"><span class="sw"></span><span><b style="font-weight:600">Spelregelboekje, huisjes, dobbelstenen</b></span><button class="textbtn">Aanzetten</button></div>
            </div>
        </div>
        <figcaption><span class="tag-na">voorstel</span>Wat uit staat, staat er licht onder. Aanzetten zet het aan en opent het.</figcaption>
    </figure>
</div>

<div class="vs">
    <figure>
        <img src="voor/d-editor.jpg" width="560" alt="Editor op 1440 px met drie rijen van de lijst">
        <figcaption><span class="tag-voor">nu</span>Op 1440 × 900 begint de lijst op 760 px. Typen en plakken in een rij kan, maar niets zegt het.</figcaption>
    </figure>
    <figure>
        <div class="col">
            <div class="edrow">
                <div class="mini" data-board="" data-size="48"></div>
                <div><div style="font-weight:600">Editie</div><div class="xs soft">naam, thema, onderdelen, woorden</div></div>
                <span style="margin-left:auto">›</span>
            </div>
            <div class="tabs4"><span class="on">Bord</span><span>Kaarten</span><span>Doos</span></div>
            <div class="edrow new" style="justify-content:space-between; padding:8px 12px"><span class="sm" style="font-weight:600">Bord tonen</span><span class="xs soft">ingeklapt onder 900 px hoog</span></div>
            <div class="search new">⌕ Zoek een vak, of plak een lijst met namen in een rij</div>
            <div class="list">
                <div class="it" style="border:2px dashed var(--line); border-radius:6px; background:var(--board)">Midden van het bord</div>
                <div class="side">Start tot Op bezoek</div>
                <div class="it"><span class="sw"></span>Start</div>
                <div class="it on new"><span class="sw" style="background:#955436"></span>Waar het allemaal begon<span class="end xs soft">typen kiest het vak</span></div>
                <div class="it"><span class="sw" style="background:var(--chest)"></span>Algemeen Fonds</div>
                <div class="it"><span class="sw" style="background:#955436"></span>De straat van je jeugd</div>
                <div class="it"><span class="sw"></span>Inkomstenbelasting</div>
                <div class="it"><span class="sw"></span>De bushalte</div>
            </div>
            <div class="warnbox new" style="background:var(--board)">10 namen ingevuld. Stations en nutsbedrijven heb ik overgeslagen.</div>
        </div>
        <figcaption><span class="tag-na">voorstel</span>Plakhint in het zoekveld, focus in een rij kiest het vak, melding noemt wat werd overgeslagen.</figcaption>
    </figure>
</div>
<script src="../integratie/bord.js"></script>
</body>
</html>
