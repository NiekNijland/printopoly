<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nieuwe editie</title>
<link rel="stylesheet" href="../integratie/stijl.css">
<link rel="stylesheet" href="extra.css">
</head>
<body>
<div class="page-title">
    <h1>Nieuwe editie: de naam bij de knop</h1>
    <p>Punt 9 en 14 uit <code>vindbaarheid.md</code>. Roze stippellijn: wat verandert.</p>
</div>

<div class="vs">
    <figure>
        <img src="voor/d-nieuw.jpg" width="620" alt="Nieuwe editie nu, naamveld buiten beeld">
        <figcaption><span class="tag-voor">nu</span>Het naamveld staat op 1300 px, onder negen sjablonen. De uitleg noemt "op de naam klikken".</figcaption>
    </figure>
    <figure>
        <div class="frame" style="width:760px; margin:0; background:var(--paper)">
            <div class="band" style="padding:28px 32px"><h1 style="font-size:40px">Nieuwe editie</h1>
                <p class="new" style="margin:8px 0 0; max-width:440px">Kies een startpunt of begin leeg. Alles hieronder pas je later aan onder Editie, bovenaan links in de editor.</p></div>
            <div style="display:grid; grid-template-columns:1fr 280px; gap:24px; padding:24px 32px">
                <div>
                    <h3 style="font-size:18px">Begin met…</h3>
                    <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:10px">
                        <div class="ecard" style="width:auto; border-color:var(--press)"><div class="art" style="height:80px"><span data-board="" data-size="60"></span></div><div class="body sm"><b>Je dorp of wijk</b></div></div>
                        <div class="ecard" style="width:auto"><div class="art" style="height:80px; background:var(--chest)"><span data-board="" data-size="60"></span></div><div class="body sm"><b>Vriendengroep</b></div></div>
                        <div class="ecard" style="width:auto"><div class="art" style="height:80px; background:#fff4c2"><span data-board="" data-size="60"></span></div><div class="body sm"><b>Bedrijf of team</b></div></div>
                    </div>
                    <p class="sm soft">Taal, thema, onderdelen en munt staan ingeklapt onder de sjablonen, zoals nu.</p>
                </div>
                <div class="ecard" style="width:auto; padding:14px; display:flex; flex-direction:column; gap:10px">
                    <div data-board="Ons dorp" data-size="248"></div>
                    <div class="field new" style="margin:0"><label>Naam van je editie</label><div class="input">Ons dorp</div></div>
                    <span class="btn primary">Editie maken</span>
                    <p class="hint">Je editie blijft in deze browser.</p>
                </div>
            </div>
        </div>
        <figcaption><span class="tag-na">voorstel</span>Naam en knop samen in de kaart die altijd in beeld is. Op de telefoon staan ze samen in de vaste balk.</figcaption>
    </figure>
</div>

<div class="vs">
    <figure>
        <img src="voor/m-nieuw.jpg" width="300" alt="Telefoon, Nieuwe editie nu">
        <figcaption><span class="tag-voor">nu</span>390 px: alleen de knop is vast.</figcaption>
    </figure>
    <figure>
        <div class="frame phone" style="height:300px; margin:0; background:var(--paper)">
            <div class="ph-body" style="height:190px"><h3 style="font-size:20px">Begin met…</h3><div class="ecard" style="width:auto"><div class="body sm"><b>Je dorp of wijk</b> gekozen</div></div></div>
            <div class="new" style="position:absolute; left:0; right:0; bottom:0; background:var(--card); border-top:2px solid var(--ink); padding:10px 12px; display:flex; flex-direction:column; gap:8px">
                <div class="input" style="height:42px">Ons dorp</div>
                <span class="btn primary">Editie maken</span>
            </div>
        </div>
        <figcaption><span class="tag-na">voorstel</span>Naam in de balk, boven de knop.</figcaption>
    </figure>
</div>

<div class="page-title">
    <h1>Mijn edities: één soort menu, één naam voor nieuw</h1>
</div>
<div class="vs">
    <figure>
        <img src="voor/d-mijn-menu.jpg" width="620" alt="Mijn edities met menu ☰">
        <figcaption><span class="tag-voor">nu</span>Kop "Editie maken" naast de knop "Nieuwe editie". Menu ☰ zonder Dupliceren.</figcaption>
    </figure>
    <figure>
        <div style="display:flex; flex-direction:column; gap:14px; align-items:flex-start">
            <div class="phead-pub" style="width:620px; border:2px solid var(--ink)"><div class="row" style="padding:0 16px; height:60px"><span class="word" style="font-size:20px">Printopoly</span><span class="sm" style="font-weight:600">Mijn edities</span><span class="spacer"></span><span class="btn small new">Nieuwe editie</span></div></div>
            <div class="ecard" style="position:relative; overflow:visible; margin-bottom:120px">
                <div class="art"><span data-board="IA-audit Dorp" data-size="170"></span></div>
                <div class="body">
                    <div style="display:flex; align-items:center"><b style="font-family:'League Spartan'; font-size:20px">IA-audit Dorp</b><span class="spacer"></span><span class="btn icon small new">⋯</span></div>
                    <div class="xs soft">Klassiek · Bewerkt 22 nov · In deze browser</div>
                    <div class="acts"><span class="btn small">Openen</span><span class="btn small">Printen</span></div>
                </div>
                <div class="menu new" style="right:-40px; top:268px; min-width:240px">
                    <div class="hl">Dupliceren<span class="xs soft">en meteen openen</span></div>
                    <div>Naam wijzigen</div><hr><div style="color:var(--press)">Verwijderen</div>
                </div>
            </div>
        </div>
        <figcaption><span class="tag-na">voorstel</span>Kop en band zeggen allebei "Nieuwe editie". Het menu is ⋯ zoals in de editor, met Dupliceren. Na dupliceren opent de kopie.</figcaption>
    </figure>
</div>
<script src="../integratie/bord.js"></script>
</body>
</html>
