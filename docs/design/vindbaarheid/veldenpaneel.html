<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veldenpaneel</title>
<link rel="stylesheet" href="../integratie/stijl.css">
<link rel="stylesheet" href="extra.css">
</head>
<body>
<div class="page-title">
    <h1>Veldenpaneel: korter naar een foto, gewone woorden</h1>
    <p>Punt 2, 11, 12 en 15 uit <code>vindbaarheid.md</code>. Roze stippellijn: wat verandert.</p>
</div>

<div class="vs">
    <figure>
        <img src="voor/d-straat-foto.jpg" width="560" alt="Afbeelding met Geen, Foto, Foto kiezen en Plakken">
        <figcaption><span class="tag-voor">nu</span>Foto, dan Foto kiezen: twee klikken. Menu ⋯ begint met Terug naar standaard (niet in beeld).</figcaption>
    </figure>
    <figure>
        <div class="panel" style="position:relative">
            <div class="phead"><div><h2>De straat van je jeugd</h2><div class="kind">Straat · bruin</div></div><span class="spacer"></span><span class="btn icon small">⋯</span></div>
            <div class="menu new" style="position:static; margin:8px 20px 0 auto; width:230px">
                <div class="hl">Wisselen met…</div>
                <hr>
                <div>Terug naar standaard</div>
            </div>
            <div class="pbody">
                <div class="sec"><h3>Tekst</h3>
                    <div class="field"><label>Naam</label><div class="input">De straat van je jeugd</div></div>
                </div>
                <div class="sec"><h3>Afbeelding</h3>
                    <div class="choice"><span class="on">Geen</span><span class="new">Foto…</span></div>
                    <p class="hint">Foto… opent meteen je foto's. Slepen of plakken kan ook.</p>
                </div>
                <div class="sec"><h3>Bedragen</h3>
                    <div class="amount"><span>Prijs</span><span class="v">− 60 +</span><span class="r new">kies 48 tot 72 · standaard 60</span></div>
                </div>
            </div>
        </div>
        <figcaption><span class="tag-na">voorstel</span>Foto… is één klik. Handelingen boven in het menu, Terug naar standaard onderaan.</figcaption>
    </figure>
</div>

<div class="vs">
    <figure>
        <img src="voor/d-kaart.jpg" width="560" alt="Kaart met het veld Verhaal en uitleg over variabelen">
        <figcaption><span class="tag-voor">nu</span>"Verhaal" en "variabelen". Bert zocht Tekst.</figcaption>
    </figure>
    <figure>
        <div class="panel">
            <div class="phead"><div><h2>Kans 3</h2><div class="kind">Kaart</div></div></div>
            <div class="pbody">
                <div class="sec"><h3>Tekst</h3>
                    <div class="field"><label class="new">Tekst van de kaart</label>
                        <div class="input area" style="display:block; line-height:1.9">Er wordt getrakteerd bij <span class="tok">Jullie stamkroeg</span>. Ga erheen. Kom je langs <span class="tok">Start</span>, dan krijg je <span class="tok">€</span> 200.</div></div>
                    <div style="display:flex; gap:12px; align-items:flex-start; margin-bottom:12px"><span class="btn small">Invoegen</span>
                        <p class="hint new">Een woord in een grijs blokje verandert mee als je het vak of het woord anders noemt.</p></div>
                    <p class="sm" style="margin:0 0 12px">› <u>Standaardtekst</u></p>
                </div>
            </div>
        </div>
        <figcaption><span class="tag-na">voorstel</span>Tekst van de kaart, met een zin over het grijze blokje.</figcaption>
    </figure>
</div>

<div class="vs">
    <figure>
        <img src="voor/d-uitnodiging.jpg" width="560" alt="Uitnodiging met Kop, Regel boven de kop, Ondertitel tonen">
        <figcaption><span class="tag-voor">nu</span>Kop staat boven de regel die erboven komt; "Ondertitel tonen" is de editienaam.</figcaption>
    </figure>
    <figure>
        <div class="panel">
            <div class="phead"><div><h2>Uitnodiging</h2><div class="kind">Uitnodiging · A6</div></div></div>
            <div class="pbody">
                <div class="sec new"><h3>Tekst <span class="n">van boven naar onder</span></h3>
                    <div class="field"><label>Regel boven de kop</label><div class="input">Spelavond</div></div>
                    <div class="field"><label>Kop</label><div class="input">Je bent uitgenodigd</div></div>
                    <div class="cbx"><span class="box on">✓</span><span>Naam van de editie eronder<small>IA-audit Dorp</small></span></div>
                    <div class="field"><label>Wanneer, waar, wat neem je mee</label><div class="input area placeholder">Zaterdag 6 september, 20.00 uur, bij Ria</div></div>
                </div>
            </div>
        </div>
        <figcaption><span class="tag-na">voorstel</span>Velden in de volgorde van de kaart, met het juiste woord voor de editienaam.</figcaption>
    </figure>
</div>

<div class="vs">
    <figure>
        <img src="voor/m-straat.jpg" width="300" alt="Telefoon, straat met dichte blokken">
        <figcaption><span class="tag-voor">nu</span>390 px: Afbeelding is dicht en zegt niet wat erin staat.</figcaption>
    </figure>
    <figure>
        <div class="frame phone" style="height:560px; margin:0">
            <div class="ph-head"><span class="btn icon small">‹</span><div><div style="font-weight:800; font-family:'League Spartan'">De straat van je jeugd</div><div class="xs soft">Straat · bruin</div></div><span class="spacer"></span><span class="btn icon small">⋯</span></div>
            <div class="ph-body" style="height:auto">
                <div class="acc"><div class="h">Tekst <span class="xs soft" style="font-family:'Instrument Sans'; font-weight:400">De straat van je jeugd −</span></div>
                    <div class="b"><div class="field"><label>Naam</label><div class="input">De straat van je jeugd</div></div></div></div>
                <div class="acc new"><div class="h">Afbeelding <span class="xs soft" style="font-family:'Instrument Sans'; font-weight:400">geen foto +</span></div></div>
                <div class="acc new"><div class="h">Bedragen <span class="xs soft" style="font-family:'Instrument Sans'; font-weight:400">€ 60 · standaard +</span></div></div>
                <div class="acc"><div class="h">Stijl <span class="xs soft" style="font-family:'Instrument Sans'; font-weight:400">bruin +</span></div></div>
            </div>
        </div>
        <figcaption><span class="tag-na">voorstel</span>Elke dichte kop zegt wat er staat, zoals het editiepaneel al doet.</figcaption>
    </figure>
</div>

<div class="vs">
    <figure>
        <img src="voor/d-midden.jpg" width="560" alt="Midden van het bord met Bordgroen en Foto toevoegen bij Extra lagen">
        <figcaption><span class="tag-voor">nu</span>Drie keer "foto": Naam met foto, Foto over het hele midden en Foto toevoegen bij Extra lagen.</figcaption>
    </figure>
    <figure>
        <div class="panel">
            <div class="pbody">
                <div class="sec"><h3>Afbeelding</h3>
                    <p class="flabel">Wat staat er in het midden?</p>
                    <div class="choice"><span class="on">Naam</span><span>Naam met foto</span><span>Logo</span></div>
                    <p class="flabel">Wat ligt eronder?</p>
                    <div class="choice"><span class="on new">Bordkleur</span><span>Foto over het hele midden</span></div>
                </div>
                <div class="sec"><h3>Stijl</h3>
                    <p class="flabel">Extra lagen <span class="group-tag">niet op de vouwlijnen</span></p>
                    <div style="display:flex; gap:8px"><span class="btn small">Tekst toevoegen</span><span class="btn small new">Extra foto erop</span></div>
                </div>
            </div>
        </div>
        <figcaption><span class="tag-na">voorstel</span>De laag heet anders dan de foto van het midden.</figcaption>
    </figure>
</div>
</body>
</html>
