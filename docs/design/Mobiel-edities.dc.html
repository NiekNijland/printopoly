<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Printopoly: mijn edities op telefoon</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700;800;900&amp;family=Instrument+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: #F6F1E4; color: #1B1F24; font-family: 'Instrument Sans', sans-serif; font-size: 15px; line-height: 1.45;">
  <header style="flex: none; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: #FFFDF7; border-bottom: 2px solid #1B1F24;">
    <a href="Mobiel-landing.dc.html" style="flex: 1; font-family: 'League Spartan', sans-serif; font-weight: 900; font-size: 22px; color: #1B1F24; text-decoration: none; text-shadow: 2px 2px 0 #00A3E0, -1px -1px 0 #E6007E;">PRINTOPOLY</a>
    <button type="button" style="min-height: 44px; padding: 0 12px; border: 2px solid #1B1F24; border-radius: 6px; background: #FFFFFF; font: 600 14px 'Instrument Sans', sans-serif;">Inloggen</button>
  </header>
  <main style="flex: 1; min-height: 0; overflow: auto; padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 16px;">
    <h1 style="margin: 0; font-family: 'League Spartan', sans-serif; font-weight: 900; font-size: 36px; line-height: 1;">Mijn edities</h1>
    <div style="background: #FFF4C2; border: 2px solid #1B1F24; border-radius: 6px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px;">
      <p style="margin: 0;"><strong>Je 3 edities staan alleen op deze telefoon.</strong> Log in met Google om ze veilig te bewaren en op je computer verder te gaan.</p>
      <button type="button" style="min-height: 44px; border: 0; border-radius: 6px; background: #1B1F24; color: #F6F1E4; font: 700 15px 'Instrument Sans', sans-serif;">Veilig bewaren</button>
    </div>
    <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px;">
      <sc-for list="{{editions}}" as="e" hint-placeholder-count="3">
        <li style="background: #FFFDF7; border: 2px solid #1B1F24; border-radius: 6px; display: flex; align-items: stretch; overflow: hidden;">
          <a href="Mobiel-bord.dc.html" style="flex: 1; display: flex; align-items: center; gap: 12px; padding: 10px 12px; color: #1B1F24; text-decoration: none;">
            <span style="{{e.thumb}}"></span>
            <span style="display: flex; flex-direction: column;">
              <strong style="font-family: 'League Spartan', sans-serif; font-weight: 800; font-size: 19px;">{{e.name}}</strong>
              <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #4A4F57;">{{e.meta}}</span>
            </span>
          </a>
          <button type="button" aria-label="{{e.more}}" style="width: 48px; border: 0; border-left: 1.5px solid rgba(27,31,36,0.25); background: transparent;"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="3.5" r="1.6" fill="#1B1F24"></circle><circle cx="9" cy="9" r="1.6" fill="#1B1F24"></circle><circle cx="9" cy="14.5" r="1.6" fill="#1B1F24"></circle></svg></button>
        </li>
      </sc-for>
    </ul>
  </main>
  <div style="flex: none; padding: 12px 16px 18px; background: #F6F1E4; border-top: 1px solid rgba(27,31,36,0.2);">
    <a href="Nieuwe-editie.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 6px; background: #C8321F; color: #FFFFFF; text-decoration: none; font-weight: 700; font-size: 17px; box-shadow: 4px 4px 0 #1B1F24;">Nieuwe editie</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var editions = [
      ['Zaterdagclub', 'Klassiek · vandaag', '#D4E9D7', '#C8321F'],
      ['Kerst bij oma', 'Riso · 3 dagen geleden', '#FFF2F7', '#E6007E'],
      ['Huize Hoogstraat', 'Strak · 2 weken geleden', '#FFFFFF', '#1B1F24']
    ].map(function (e) {
      return {
        name: e[0], meta: e[1], more: 'Meer acties voor ' + e[0],
        thumb: 'width: 52px; height: 52px; flex: none; background: ' + e[2] + '; border: 2px solid #1B1F24; box-shadow: inset 0 0 0 8px rgba(27,31,36,0.1), inset 0 0 0 16px ' + e[3] + ';'
      };
    });
    return { editions: editions };
  }
}
</script>
</body>
</html>
