<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Printopoly: mijn edities op telefoon</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@800&amp;family=Instrument+Sans:wght@400;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#1B1F24}
:focus-visible{outline:3px solid #1B1F24;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: #F6F1E4; color: #1B1F24; font-family: 'Instrument Sans', sans-serif; font-size: 16px; line-height: 1.5;">
  <header style="flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-bottom: 1px solid rgba(27,31,36,0.2);">
    <a href="Mobiel-landing.dc.html" style="flex: 1; display: flex; align-items: center; gap: 8px; min-height: 48px; text-decoration: none;">
      <svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="8" fill="none" stroke="#1B1F24" stroke-width="2"></circle><circle cx="14" cy="14" r="3" fill="#C8321F"></circle><path d="M14 1v7M14 20v7M1 14h7M20 14h7" stroke="#1B1F24" stroke-width="2"></path></svg>
      <span style="font-family: 'League Spartan', sans-serif; font-weight: 800; font-size: 20px;">Printopoly</span>
    </a>
    <button type="button" aria-label="Menu" style="width: 48px; height: 48px; border: 2px solid #1B1F24; border-radius: 6px; background: transparent;"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="#1B1F24" stroke-width="1.75" stroke-linecap="round"></path></svg></button>
  </header>
  <main style="flex: 1; min-height: 0; overflow: auto; padding: 24px 16px; display: flex; flex-direction: column; gap: 16px;">
    <h1 style="margin: 0; font-family: 'League Spartan', sans-serif; font-weight: 800; font-size: 32px; line-height: 1.1;">Mijn edities</h1>
    <div style="border: 2px solid #1B1F24; border-radius: 6px; background: #FFFDF7; padding: 16px; display: flex; flex-direction: column; gap: 12px;">
      <p style="margin: 0;">Je 3 edities staan alleen in deze browser. Safari wist ze als je de site 7 dagen niet opent.</p>
      <button type="button" style="height: 48px; border: 2px solid #1B1F24; border-radius: 6px; background: transparent; font: 600 16px 'Instrument Sans', sans-serif;">Inloggen met Google</button>
    </div>
    <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px;">
      <sc-for list="{{editions}}" as="e" hint-placeholder-count="3">
        <li style="background: #FFFDF7; border: 2px solid #1B1F24; border-radius: 6px; display: flex; align-items: center;">
          <a href="Mobiel-bord.dc.html" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 12px; text-decoration: none;">
            <span style="{{e.thumb}}"></span>
            <span style="display: flex; flex-direction: column; min-width: 0;">
              <strong style="font-family: 'League Spartan', sans-serif; font-weight: 800; font-size: 20px;">{{e.name}}</strong>
              <span style="font-size: 14px; color: #4A4F57;">{{e.meta}}</span>
            </span>
          </a>
          <button type="button" aria-label="{{e.more}}" style="width: 48px; height: 48px; margin-right: 8px; flex: none; border: 2px solid #1B1F24; border-radius: 6px; background: transparent;"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="4" cy="10" r="1.5" fill="#1B1F24"></circle><circle cx="10" cy="10" r="1.5" fill="#1B1F24"></circle><circle cx="16" cy="10" r="1.5" fill="#1B1F24"></circle></svg></button>
        </li>
      </sc-for>
    </ul>
  </main>
  <div style="flex: none; padding: 12px 16px 24px; border-top: 1px solid rgba(27,31,36,0.2);">
    <a href="Nieuwe-editie.dc.html" style="display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 6px; background: #C8321F; color: #FFFFFF; text-decoration: none; font-weight: 600;">Nieuwe editie</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var editions = [
      ['Zaterdagclub', 'Klassiek · vandaag · alleen hier', '#D4E9D7', '#955436'],
      ['Kerst bij oma', 'Riso · 3 dagen geleden · alleen hier', '#FFF2F7', '#E6007E'],
      ['Huize Hoogstraat', 'Strak · 2 weken geleden · alleen hier', '#FFFFFF', '#1B1F24']
    ].map(function (e) {
      return {
        name: e[0], meta: e[1], more: 'Meer acties voor ' + e[0],
        thumb: 'width: 56px; height: 56px; flex: none; box-sizing: border-box; background: ' + e[2] + '; border: 2px solid #1B1F24; box-shadow: inset 0 0 0 6px ' + e[2] + ', inset 0 0 0 7px rgba(27,31,36,0.5), inset 0 0 0 10px ' + e[3] + ';'
      };
    });
    return { editions: editions };
  }
}
</script>
</body>
</html>
