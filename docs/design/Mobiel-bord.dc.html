<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Printopoly: bordoverzicht op telefoon</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700;800;900&amp;family=Instrument+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #E9E3D3; color: #1B1F24; font-family: 'Instrument Sans', sans-serif; font-size: 15px;">
  <header style="flex: none; background: #FFFDF7; border-bottom: 2px solid #1B1F24; padding: 10px 12px; display: flex; align-items: center; gap: 8px;">
    <a href="Mobiel-edities.dc.html" aria-label="Terug naar mijn edities" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 2px solid #1B1F24; border-radius: 6px;"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M11 3 5 9l6 6" fill="none" stroke="#1B1F24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
    <div style="flex: 1; display: flex; flex-direction: column; line-height: 1.15;">
      <span style="font-family: 'League Spartan', sans-serif; font-weight: 800; font-size: 20px;">Zaterdagclub</span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #4A4F57;">opgeslagen op deze telefoon</span>
    </div>
    <a href="Mobiel-download.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 6px; background: #C8321F; color: #FFFFFF; text-decoration: none; font-weight: 700; box-shadow: 3px 3px 0 #1B1F24;">Printen</a>
  </header>

  <div role="tablist" aria-label="Onderdelen" style="flex: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; padding: 10px 12px; background: #FFFDF7; border-bottom: 1px solid rgba(27,31,36,0.2);">
    <button type="button" role="tab" aria-selected="true" style="min-height: 40px; border-radius: 20px; border: 0; background: #1B1F24; color: #F6F1E4; font: 600 14px 'Instrument Sans', sans-serif;">Bord</button>
    <button type="button" role="tab" aria-selected="false" style="min-height: 40px; border-radius: 20px; border: 1.5px solid #1B1F24; background: transparent; font: 600 14px 'Instrument Sans', sans-serif;">Kaarten</button>
    <button type="button" role="tab" aria-selected="false" style="min-height: 40px; border-radius: 20px; border: 1.5px solid #1B1F24; background: transparent; font: 600 14px 'Instrument Sans', sans-serif;">Geld</button>
    <button type="button" role="tab" aria-selected="false" style="min-height: 40px; border-radius: 20px; border: 1.5px solid #1B1F24; background: transparent; font: 600 14px 'Instrument Sans', sans-serif;">Extra's</button>
  </div>

  <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 12px 16px;">
    <div style="width: 358px; height: 358px; display: grid; grid-template-columns: 1.65fr repeat(9, minmax(0, 1fr)) 1.65fr; grid-template-rows: 1.65fr repeat(9, minmax(0, 1fr)) 1.65fr; background: #D4E9D7; border: 2px solid #1B1F24;">
      <sc-for list="{{cells}}" as="c" hint-placeholder-count="40">
        <a href="Editor-mobiel.dc.html" aria-label="{{c.aria}}" style="{{c.style}}"></a>
      </sc-for>
      <div style="grid-row: 2 / 11; grid-column: 2 / 11; display: flex; align-items: center; justify-content: center;">
        <div style="transform: rotate(-45deg); font-family: 'League Spartan', sans-serif; font-weight: 900; font-size: 22px; background: #C8321F; color: #FFFFFF; padding: 6px 10px 3px; border: 2px solid #1B1F24;">ZATERDAGCLUB</div>
      </div>
    </div>
    <p style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #4A4F57;">tik een vak om het te bewerken · knijp om te zoomen</p>
  </div>

  <div style="flex: none; background: #FFFDF7; border-top: 2px solid #1B1F24; padding: 10px 12px 14px; display: flex; flex-direction: column; gap: 10px;">
    <a href="#" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 6px; background: #FFF4C2; border: 1.5px solid #1B1F24; color: #1B1F24; text-decoration: none; font-size: 14px; font-weight: 600;">
      <svg width="16" height="16" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1 12.5 3v4c0 3-2.4 5.2-5.5 6C3.9 12.2 1.5 10 1.5 7V3Z" fill="none" stroke="#1B1F24" stroke-width="1.5"></path></svg>
      Log in om je editie veilig te bewaren
    </a>
    <div style="display: flex; gap: 8px;">
      <button type="button" style="flex: 1; min-height: 44px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 2px solid #1B1F24; border-radius: 6px; background: #FFFFFF; font: 600 15px 'Instrument Sans', sans-serif;">Controle <span style="background: #C8321F; color: #FFFFFF; border-radius: 10px; padding: 0 7px; font-size: 12px;">2</span></button>
      <button type="button" aria-label="Ongedaan maken" style="width: 48px; min-height: 44px; border: 2px solid #1B1F24; border-radius: 6px; background: #FFFFFF;"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M6 4 2 8l4 4M2 8h9a5 5 0 0 1 0 10h-2" fill="none" stroke="#1B1F24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
      <button type="button" aria-label="Opnieuw" style="width: 48px; min-height: 44px; border: 2px solid #1B1F24; border-radius: 6px; background: #FFFFFF;"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="m12 4 4 4-4 4M16 8H7a5 5 0 0 0 0 10h2" fill="none" stroke="#1B1F24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var C = { br: '#955436', lb: '#AAE0FA', pk: '#D93A96', or: '#F7941D', rd: '#ED1B24', ye: '#FEF200', gr: '#1FB25A', db: '#0072BB' };
    var t = ['c', 'br', '-', 'br', '-', '-', 'lb', '-', 'lb', 'lb', 'c', 'pk', '-', 'pk', 'pk', '-', 'or', '-', 'or', 'or', 'c', 'rd', '-', 'rd', 'rd', '-', 'ye', 'ye', '-', 'ye', 'c', 'gr', 'gr', '-', 'gr', '-', '-', 'db', '-', 'db'];
    var cells = t.map(function (k, i) {
      var row, col, band;
      if (i <= 10) { row = 11; col = 11 - i; band = 'inset 0 7px 0 '; }
      else if (i <= 20) { row = 11 - (i - 10); col = 1; band = 'inset -7px 0 0 '; }
      else if (i <= 30) { row = 1; col = 1 + (i - 20); band = 'inset 0 -7px 0 '; }
      else { row = 1 + (i - 30); col = 11; band = 'inset 7px 0 0 '; }
      var s = 'grid-row: ' + row + '; grid-column: ' + col + '; display: block; border: 0.5px solid rgba(27,31,36,0.45);';
      if (k === 'c') s += ' background: #C5DFC9;';
      var shadows = [];
      if (C[k]) shadows.push(band + C[k]);
      if (i === 24) shadows.push('inset 0 0 0 2px #C8321F');
      if (shadows.length) s += ' box-shadow: ' + shadows.join(', ') + ';';
      return { style: s, aria: 'Vak ' + i + (i === 24 ? ', heeft een waarschuwing' : '') };
    });
    return { cells: cells };
  }
}
</script>
</body>
</html>
