<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Printopoly: drukwerk</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700;800;900&amp;family=Instrument+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1440px; height: 1180px; box-sizing: border-box; padding: 64px 72px; background: #E9E3D3; color: #1B1F24; font-family: 'Instrument Sans', sans-serif; display: flex; flex-direction: column; gap: 40px;">

  <div style="display: flex; justify-content: space-between; align-items: flex-end;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <p style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.08em;">DRUKWERK · THEMA "KLASSIEK" · VOORBEELD ZATERDAGCLUB</p>
      <h1 style="margin: 0; font-family: 'League Spartan', sans-serif; font-weight: 900; font-size: 48px; line-height: 1;">Kaarten, eigendomsbewijs en geld</h1>
    </div>
    <p style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 13px; text-align: right;">kaarten 63 × 88 mm · getoond op 4 px per mm<br>alle teksten in eigen woorden</p>
  </div>

  <div style="display: flex; gap: 36px; align-items: flex-start;">

    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px;">
      <div style="width: 252px; height: 352px; box-sizing: border-box; background: #FFFDF7; border: 1px solid rgba(27,31,36,0.3); border-radius: 12px; box-shadow: 4px 4px 0 rgba(27,31,36,0.18); padding: 18px; display: flex; flex-direction: column;">
        <div style="border: 2px solid #1B1F24; display: flex; flex-direction: column; flex: 1;">
          <div style="background: #955436; color: #FFFFFF; padding: 10px 8px 8px; text-align: center; display: flex; flex-direction: column; gap: 2px;">
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.14em;">EIGENDOMSBEWIJS</span>
            <span style="font-family: 'League Spartan', sans-serif; font-weight: 800; font-size: 19px; line-height: 1.05; text-transform: uppercase;">Jans Bierkelder</span>
          </div>
          <div style="height: 64px; background: #CFC6B2; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #3E434A; border-bottom: 1px solid #1B1F24;">[foto van de kelder]</div>
          <div style="padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; font-size: 11px; line-height: 1.35;">
            <div style="display: flex; justify-content: space-between;"><span>Huur</span><span style="font-family: 'IBM Plex Mono', monospace;">€ 2</span></div>
            <div style="display: flex; justify-content: space-between;"><span>Hele kleurgroep</span><span style="font-family: 'IBM Plex Mono', monospace;">€ 4</span></div>
            <div style="display: flex; justify-content: space-between;"><span>Met 1 huis</span><span style="font-family: 'IBM Plex Mono', monospace;">€ 10</span></div>
            <div style="display: flex; justify-content: space-between;"><span>Met 2 huizen</span><span style="font-family: 'IBM Plex Mono', monospace;">€ 30</span></div>
            <div style="display: flex; justify-content: space-between;"><span>Met 3 huizen</span><span style="font-family: 'IBM Plex Mono', monospace;">€ 90</span></div>
            <div style="display: flex; justify-content: space-between;"><span>Met 4 huizen</span><span style="font-family: 'IBM Plex Mono', monospace;">€ 160</span></div>
            <div style="display: flex; justify-content: space-between;"><span>Met hotel</span><span style="font-family: 'IBM Plex Mono', monospace;">€ 250</span></div>
            <div style="border-top: 1px solid rgba(27,31,36,0.3); margin-top: 4px; padding-top: 4px; text-align: center; font-size: 10px;">Huis € 50 · hotel € 50 plus 4 huizen</div>
          </div>
        </div>
      </div>
      <figcaption style="font-size: 14px;">Eigendomsbewijs, voorkant</figcaption>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px;">
      <div style="width: 252px; height: 352px; box-sizing: border-box; background: #FFFDF7; border: 1px solid rgba(27,31,36,0.3); border-radius: 12px; box-shadow: 4px 4px 0 rgba(27,31,36,0.18); padding: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center;">
        <span style="font-family: 'League Spartan', sans-serif; font-weight: 800; font-size: 18px; text-transform: uppercase;">Jans Bierkelder</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.1em;">HYPOTHEEK</span>
        <span style="font-family: 'League Spartan', sans-serif; font-weight: 900; font-size: 40px; line-height: 1;">€ 30</span>
        <span style="font-size: 11px; max-width: 170px;">Draai deze kaart om als je hem hebt verhypothekeerd. Aflossen kost € 33.</span>
      </div>
      <figcaption style="font-size: 14px;">Eigendomsbewijs, achterkant</figcaption>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px;">
      <div style="width: 252px; height: 352px; box-sizing: border-box; background: #F4A259; border: 1px solid rgba(27,31,36,0.3); border-radius: 12px; box-shadow: 4px 4px 0 rgba(27,31,36,0.18); padding: 18px; display: flex; flex-direction: column; gap: 14px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span style="font-family: 'League Spartan', sans-serif; font-weight: 900; font-size: 30px; line-height: 1;">KANS</span>
          <svg width="28" height="28" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="11" fill="none" stroke="#1B1F24" stroke-width="2.5"></circle><circle cx="17" cy="17" r="4" fill="#1B1F24"></circle><path d="M17 1v8M17 25v8M1 17h8M25 17h8" stroke="#1B1F24" stroke-width="2.5"></path></svg>
        </div>
        <div style="height: 110px; background: rgba(255,253,247,0.6); border: 1.5px solid #1B1F24; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 10px;">[foto: Pieters fiets]</div>
        <p style="margin: 0; font-size: 14px; line-height: 1.35;">Pieters fiets staat weer eens op slot bij het station. Haal hem op: ga naar het dichtstbijzijnde station.</p>
        <p style="margin: 0; margin-top: auto; font-weight: 700; font-size: 13px;">Kom je langs Start, ontvang dan € 200.</p>
      </div>
      <figcaption style="font-size: 14px;">Kanskaart, voorkant</figcaption>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px;">
      <div style="width: 252px; height: 352px; box-sizing: border-box; background: #F7D96B; border: 1px solid rgba(27,31,36,0.3); border-radius: 12px; box-shadow: 4px 4px 0 rgba(27,31,36,0.18); padding: 18px; display: flex; flex-direction: column; gap: 14px;">
        <span style="font-family: 'League Spartan', sans-serif; font-weight: 900; font-size: 24px; line-height: 1;">ALGEMEEN FONDS</span>
        <p style="margin: 0; font-size: 15px; line-height: 1.4;">Lisa was haar sleutels weer kwijt en jij was gelukkig thuis.</p>
        <p style="margin: 0; font-family: 'League Spartan', sans-serif; font-weight: 800; font-size: 26px;">Ontvang € 50</p>
        <div style="margin-top: auto; border-top: 1.5px dashed #1B1F24; padding-top: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: #3E434A;">ORIGINEEL: ONTVANG € 50 VAN DE BANK</div>
      </div>
      <figcaption style="font-size: 14px;">Algemeen Fonds, voorkant</figcaption>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px;">
      <div style="width: 252px; height: 352px; box-sizing: border-box; background: #F4A259; border: 1px solid rgba(27,31,36,0.3); border-radius: 12px; box-shadow: 4px 4px 0 rgba(27,31,36,0.18); padding: 18px; display: flex; align-items: center; justify-content: center;">
        <div style="border: 3px solid #1B1F24; width: 100%; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; transform: rotate(-90deg) scale(0.72);">
          <span style="font-family: 'League Spartan', sans-serif; font-weight: 900; font-size: 64px; line-height: 1; text-shadow: 3px 3px 0 #FFFDF7;">KANS</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.12em;">ZATERDAGCLUB</span>
        </div>
      </div>
      <figcaption style="font-size: 14px;">Kanskaart, achterkant</figcaption>
    </figure>
  </div>

  <div style="display: flex; gap: 48px; align-items: flex-start;">
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px;">
      <div style="width: 560px; height: 260px; box-sizing: border-box; background: #EBD7F0; border: 1px solid rgba(27,31,36,0.3); box-shadow: 4px 4px 0 rgba(27,31,36,0.18); padding: 14px; display: flex;">
        <div style="flex: 1; border: 2px solid #4A2A57; display: flex; align-items: stretch;">
          <div style="width: 150px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-right: 2px dashed #4A2A57; gap: 6px;">
            <span style="font-family: 'League Spartan', sans-serif; font-weight: 900; font-size: 64px; line-height: 1; color: #4A2A57;">100</span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #4A2A57;">SPEELGELD</span>
          </div>
          <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; position: relative;">
            <div style="width: 104px; height: 104px; border-radius: 50%; border: 2px solid #4A2A57; background: #D9C3E0; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #4A2A57;">[foto Jan]</div>
            <span style="font-family: 'League Spartan', sans-serif; font-weight: 800; font-size: 18px; color: #4A2A57;">BANK VAN DE ZATERDAGCLUB</span>
            <span style="position: absolute; right: 12px; top: 10px; font-family: 'League Spartan', sans-serif; font-weight: 900; font-size: 26px; color: #4A2A57;">€ 100</span>
          </div>
        </div>
      </div>
      <figcaption style="font-size: 14px;">Biljet van 100: eigen kleur en foto per coupure, met "speelgeld" erop en niets van een echt eurobiljet</figcaption>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px; flex: 1;">
      <div style="height: 260px; display: flex; gap: 24px; align-items: center;">
        <div style="width: 368px; height: 260px; box-sizing: border-box; background: #FFFFFF; border: 1px solid rgba(27,31,36,0.3); box-shadow: 4px 4px 0 rgba(27,31,36,0.18); position: relative; padding: 22px 24px 30px;">
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 8px; height: 100%;">
            <sc-for list="{{fold}}" as="f" hint-placeholder-count="4">
              <div style="display: flex; border: 1px solid rgba(27,31,36,0.4);">
                <div style="flex: 1; background: #F4A259; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 8px;">{{f.front}}</div>
                <div style="width: 0; border-left: 1px dashed #1B1F24;"></div>
                <div style="flex: 1; background: #F7C08F; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 8px;">achter</div>
              </div>
            </sc-for>
          </div>
          <span style="position: absolute; left: 24px; bottom: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 9px;">Kans 1 t/m 4 · vel 1 van 4 · print op werkelijke grootte</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.45; max-width: 300px;">
          <p style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em;">THUISPRINT · A4 LIGGEND</p>
          <p style="margin: 0;">Vier vouwkaarten per vel. Knip langs de snijtekens, vouw over de stippellijn en lijm de helften op elkaar. Zo heb je geen last van een printer die dubbelzijdig verschuift.</p>
        </div>
      </div>
      <figcaption style="font-size: 14px;">Een vel uit de thuisprint-set</figcaption>
    </figure>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    return { fold: [{ front: 'Kans 1' }, { front: 'Kans 2' }, { front: 'Kans 3' }, { front: 'Kans 4' }] };
  }
}
</script>
</body>
</html>
