<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Printopoly: drukwerk van een editie</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@800&amp;family=Instrument+Sans:wght@400;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1440px; height: 1100px; box-sizing: border-box; padding: 64px; background: #E9E3D3; color: #1B1F24; font-family: 'Instrument Sans', sans-serif; font-size: 16px; line-height: 1.5; display: flex; flex-direction: column; gap: 48px;">

  <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 48px;">
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <h1 style="margin: 0; font-family: 'League Spartan', sans-serif; font-weight: 800; font-size: 32px; line-height: 1.1;">Drukwerk van de Zaterdagclub</h1>
      <p style="margin: 0; color: #4A4F57;">Thema Klassiek. Alle teksten in eigen woorden; de waarden zijn die van het spel.</p>
    </div>
    <p style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #4A4F57;">kaarten 63 × 88 mm · getoond op 4 px per mm</p>
  </div>

  <div style="display: flex; gap: 32px; align-items: flex-start;">
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 12px;">
      <div style="width: 252px; height: 352px; box-sizing: border-box; background: #FFFDF7; border: 1px solid rgba(27,31,36,0.3); border-radius: 12px; box-shadow: 4px 4px 0 rgba(27,31,36,0.15); padding: 16px; display: flex;">
        <div style="flex: 1; border: 2px solid #1B1F24; display: flex; flex-direction: column;">
          <div style="background: #955436; color: #FFFFFF; padding: 8px; text-align: center; display: flex; flex-direction: column; gap: 2px;">
            <span style="font-size: 12px;">Eigendomsbewijs</span>
            <span style="font-family: 'League Spartan', sans-serif; font-weight: 800; font-size: 20px; line-height: 1.1;">Jans Bierkelder</span>
          </div>
          <div style="height: 64px; background: #CFC6B2; border-bottom: 1px solid #1B1F24;"></div>
          <div style="padding: 8px 12px; display: flex; flex-direction: column; gap: 2px; font-size: 12px; line-height: 1.4;">
            <sc-for list="{{rent}}" as="r" hint-placeholder-count="7">
              <div style="display: flex; justify-content: space-between;"><span>{{r.label}}</span><span style="font-family: 'IBM Plex Mono', monospace;">{{r.value}}</span></div>
            </sc-for>
            <div style="border-top: 1px solid rgba(27,31,36,0.3); margin-top: 4px; padding-top: 4px; text-align: center;">Huis € 50 · hotel € 50 plus 4 huizen</div>
          </div>
        </div>
      </div>
      <figcaption style="font-size: 14px;">Eigendomsbewijs, voorkant</figcaption>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; gap: 12px;">
      <div style="width: 252px; height: 352px; box-sizing: border-box; background: #FFFDF7; border: 1px solid rgba(27,31,36,0.3); border-radius: 12px; box-shadow: 4px 4px 0 rgba(27,31,36,0.15); padding: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center;">
        <span style="font-family: 'League Spartan', sans-serif; font-weight: 800; font-size: 20px;">Jans Bierkelder</span>
        <span style="font-size: 14px;">Hypotheek</span>
        <span style="font-family: 'League Spartan', sans-serif; font-weight: 800; font-size: 40px; line-height: 1;">€ 30</span>
        <span style="font-size: 12px; max-width: 170px;">Leg deze kaart omgedraaid neer zolang hij verhypothekeerd is. Aflossen kost € 33.</span>
      </div>
      <figcaption style="font-size: 14px;">Eigendomsbewijs, achterkant</figcaption>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; gap: 12px;">
      <div style="width: 252px; height: 352px; box-sizing: border-box; background: #CCEDF9; border: 1px solid rgba(27,31,36,0.3); border-radius: 12px; box-shadow: 4px 4px 0 rgba(27,31,36,0.15); padding: 16px; display: flex; flex-direction: column; gap: 12px;">
        <span style="font-family: 'League Spartan', sans-serif; font-weight: 800; font-size: 32px; line-height: 1;">Kans</span>
        <div style="height: 112px; background: #A9D9EC; border: 1px solid #1B1F24;"></div>
        <p style="margin: 0; font-size: 14px; line-height: 1.4;">Pieters fiets staat weer eens op slot bij het station. Ga naar het dichtstbijzijnde station om hem op te halen.</p>
        <p style="margin: 0; margin-top: auto; font-weight: 600; font-size: 14px;">Kom je langs Start, ontvang dan € 200.</p>
      </div>
      <figcaption style="font-size: 14px;">Kanskaart, voorkant</figcaption>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; gap: 12px;">
      <div style="width: 252px; height: 352px; box-sizing: border-box; background: #FACCE5; border: 1px solid rgba(27,31,36,0.3); border-radius: 12px; box-shadow: 4px 4px 0 rgba(27,31,36,0.15); padding: 16px; display: flex; flex-direction: column; gap: 12px;">
        <span style="font-family: 'League Spartan', sans-serif; font-weight: 800; font-size: 24px; line-height: 1.1;">Algemeen Fonds</span>
        <p style="margin: 0; font-size: 16px; line-height: 1.4;">Lisa was haar sleutels weer kwijt en jij was gelukkig thuis.</p>
        <p style="margin: 0; margin-top: auto; font-family: 'League Spartan', sans-serif; font-weight: 800; font-size: 24px;">Ontvang € 50</p>
      </div>
      <figcaption style="font-size: 14px;">Algemeen Fonds, voorkant</figcaption>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; gap: 12px;">
      <div style="width: 252px; height: 352px; box-sizing: border-box; background: #CCEDF9; border: 1px solid rgba(27,31,36,0.3); border-radius: 12px; box-shadow: 4px 4px 0 rgba(27,31,36,0.15); padding: 16px; display: flex;">
        <div style="flex: 1; border: 2px solid #1B1F24; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;">
          <span style="font-family: 'League Spartan', sans-serif; font-weight: 800; font-size: 48px; line-height: 1;">Kans</span>
          <span style="font-size: 14px;">Zaterdagclub</span>
        </div>
      </div>
      <figcaption style="font-size: 14px;">Kanskaart, achterkant</figcaption>
    </figure>
  </div>

  <div style="display: flex; gap: 48px; align-items: flex-start;">
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 12px;">
      <div style="width: 520px; height: 240px; box-sizing: border-box; background: #EBD7F0; border: 1px solid rgba(27,31,36,0.3); box-shadow: 4px 4px 0 rgba(27,31,36,0.15); padding: 12px; display: flex;">
        <div style="flex: 1; border: 2px solid #4A2A57; display: flex; color: #4A2A57;">
          <div style="width: 144px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-right: 1px solid #4A2A57; gap: 4px;">
            <span style="font-family: 'League Spartan', sans-serif; font-weight: 800; font-size: 56px; line-height: 1;">100</span>
            <span style="font-size: 12px;">speelgeld</span>
          </div>
          <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; position: relative;">
            <div style="width: 96px; height: 96px; border-radius: 50%; border: 2px solid #4A2A57; background: #D9C3E0;"></div>
            <span style="font-family: 'League Spartan', sans-serif; font-weight: 800; font-size: 16px;">Bank van de Zaterdagclub</span>
            <span style="position: absolute; right: 12px; top: 8px; font-family: 'League Spartan', sans-serif; font-weight: 800; font-size: 24px;">€ 100</span>
          </div>
        </div>
      </div>
      <figcaption style="font-size: 14px;">Biljet van 100, met een foto van Jan</figcaption>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; gap: 12px;">
      <div style="position: relative; padding: 16px;">
        <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 12px; height: 12px; border-right: 1px solid #1B1F24; border-bottom: 1px solid #1B1F24;"></div>
        <div aria-hidden="true" style="position: absolute; right: 0; top: 0; width: 12px; height: 12px; border-left: 1px solid #1B1F24; border-bottom: 1px solid #1B1F24;"></div>
        <div aria-hidden="true" style="position: absolute; left: 0; bottom: 0; width: 12px; height: 12px; border-right: 1px solid #1B1F24; border-top: 1px solid #1B1F24;"></div>
        <div aria-hidden="true" style="position: absolute; right: 0; bottom: 0; width: 12px; height: 12px; border-left: 1px solid #1B1F24; border-top: 1px solid #1B1F24;"></div>
        <div style="width: 336px; height: 238px; box-sizing: border-box; background: #FFFFFF; box-shadow: 4px 4px 0 rgba(27,31,36,0.15); padding: 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 8px;">
          <sc-for list="{{fold}}" as="f" hint-placeholder-count="4">
            <div style="display: flex; border: 1px solid rgba(27,31,36,0.3);">
              <div style="flex: 1; background: #CCEDF9; display: flex; align-items: center; justify-content: center; font-size: 12px;">{{f.front}}</div>
              <div style="width: 0; border-left: 1px dashed #1B1F24;"></div>
              <div style="flex: 1; background: #E6F6FC; display: flex; align-items: center; justify-content: center; font-size: 12px;">achter</div>
            </div>
          </sc-for>
        </div>
      </div>
      <figcaption style="font-size: 14px; max-width: 368px;">Thuisprint, A4 liggend: vier vouwkaarten per vel. Vouw over de stippellijn en lijm de helften op elkaar.</figcaption>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; gap: 12px;">
      <div style="width: 238px; height: 336px; box-sizing: border-box; background: #FFFFFF; box-shadow: 4px 4px 0 rgba(27,31,36,0.15); padding: 16px; display: flex; flex-direction: column; gap: 16px;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <svg width="20" height="20" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="8" fill="none" stroke="#1B1F24" stroke-width="2"></circle><circle cx="14" cy="14" r="3" fill="#C8321F"></circle><path d="M14 1v7M14 20v7M1 14h7M20 14h7" stroke="#1B1F24" stroke-width="2"></path></svg>
          <span style="font-family: 'League Spartan', sans-serif; font-weight: 800; font-size: 14px;">Proefvel</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <div style="height: 12px; border: 1px solid #1B1F24; border-top: 0; background: repeating-linear-gradient(90deg, #1B1F24 0 1px, transparent 1px 11.3px);"></div>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px;">100 mm</span>
        </div>
        <div style="width: 97px; height: 61px; border: 1px solid #1B1F24; border-radius: 3px;"></div>
        <span style="font-size: 12px;">Past je bankpas precies, dan print je op de juiste grootte.</span>
        <div style="margin-top: auto; display: flex; gap: 8px; align-items: flex-end;">
          <div style="width: 56px; height: 56px; background: #C5DFC9; border: 1px solid #1B1F24;"></div>
          <div style="width: 32px; height: 56px; border: 1px solid #1B1F24; box-shadow: inset 0 8px 0 #955436;"></div>
        </div>
      </div>
      <figcaption style="font-size: 14px;">Proefvel, A4 (verkleind)</figcaption>
    </figure>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    var rent = [['Huur', '€ 2'], ['Hele kleurgroep', '€ 4'], ['Met 1 huis', '€ 10'], ['Met 2 huizen', '€ 30'], ['Met 3 huizen', '€ 90'], ['Met 4 huizen', '€ 160'], ['Met hotel', '€ 250']]
      .map(function (r) { return { label: r[0], value: r[1] }; });
    return { rent: rent, fold: [{ front: 'Kans 1' }, { front: 'Kans 2' }, { front: 'Kans 3' }, { front: 'Kans 4' }] };
  }
}
</script>
</body>
</html>
